<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Mahasiswa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #2563eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .button-group {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-simpan {
            background: #2563eb;
            color: white;
        }

        .btn-batal {
            background: #64748b;
            color: white;
        }

        .btn-download {
            background: #16a34a;
            color: white;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .btn-hapus {
            background: #dc2626;
            color: white;
        }

        .pencarian {
            width: 100%;
            margin-bottom: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .kosong {
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Database Mahasiswa</h1>

        <form id="formMahasiswa">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama mahasiswa"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input
                        type="text"
                        id="nim"
                        placeholder="Masukkan NIM"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="kelamin">Jenis Kelamin</label>
                    <select id="kelamin" required>
                        <option value="">Pilih jenis kelamin</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="semester">Semester</label>
                    <input
                        type="number"
                        id="semester"
                        min="1"
                        max="14"
                        placeholder="1–14"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="ipk">IPK</label>
                    <input
                        type="number"
                        id="ipk"
                        min="0"
                        max="4"
                        step="0.01"
                        placeholder="0.00–4.00"
                        required
                    >
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-simpan" id="tombolSimpan">
                    Simpan Data
                </button>

                <button type="button" class="btn-batal" onclick="resetForm()">
                    Batal
                </button>

                <button type="button" class="btn-download" onclick="unduhCSV()">
                    Unduh CSV
                </button>
            </div>
        </form>

        <input
            class="pencarian"
            type="search"
            id="pencarian"
            placeholder="Cari berdasarkan nama atau NIM..."
            oninput="tampilkanData()"
        >

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Kelamin</th>
                        <th>Semester</th>
                        <th>IPK</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="tabelMahasiswa"></tbody>
            </table>
        </div>
    </main>

    <script>
        const KUNCI_DATABASE = "database_mahasiswa";
        let nimYangDiedit = null;

        function ambilData() {
            return JSON.parse(localStorage.getItem(KUNCI_DATABASE)) || [];
        }

        function simpanDatabase(data) {
            localStorage.setItem(KUNCI_DATABASE, JSON.stringify(data));
        }

        document
            .getElementById("formMahasiswa")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                const mahasiswaBaru = {
                    nama: document.getElementById("nama").value.trim(),
                    nim: document.getElementById("nim").value.trim(),
                    kelamin: document.getElementById("kelamin").value,
                    semester: Number(document.getElementById("semester").value),
                    ipk: Number(document.getElementById("ipk").value)
                };

                if (mahasiswaBaru.semester < 1 || mahasiswaBaru.semester > 14) {
                    alert("Semester harus berada antara 1 sampai 14.");
                    return;
                }

                if (mahasiswaBaru.ipk < 0 || mahasiswaBaru.ipk > 4) {
                    alert("IPK harus berada antara 0.00 sampai 4.00.");
                    return;
                }

                const data = ambilData();

                const nimSudahAda = data.some(function (mahasiswa) {
                    return mahasiswa.nim === mahasiswaBaru.nim &&
                           mahasiswa.nim !== nimYangDiedit;
                });

                if (nimSudahAda) {
                    alert("NIM tersebut sudah terdaftar.");
                    return;
                }

                if (nimYangDiedit !== null) {
                    const index = data.findIndex(function (mahasiswa) {
                        return mahasiswa.nim === nimYangDiedit;
                    });

                    if (index !== -1) {
                        data[index] = mahasiswaBaru;
                    }
                } else {
                    data.push(mahasiswaBaru);
                }

                simpanDatabase(data);
                resetForm();
                tampilkanData();
            });

        function tampilkanData() {
            const tabel = document.getElementById("tabelMahasiswa");
            const kataKunci = document
                .getElementById("pencarian")
                .value
                .toLowerCase();

            const data = ambilData().filter(function (mahasiswa) {
                return (
                    mahasiswa.nama.toLowerCase().includes(kataKunci) ||
                    mahasiswa.nim.toLowerCase().includes(kataKunci)
                );
            });

            tabel.innerHTML = "";

            if (data.length === 0) {
                tabel.innerHTML = `
                    <tr>
                        <td colspan="7" class="kosong">
                            Belum ada data mahasiswa.
                        </td>
                    </tr>
                `;
                return;
            }

            data.forEach(function (mahasiswa, index) {
                const baris = document.createElement("tr");

                baris.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${aman(mahasiswa.nama)}</td>
                    <td>${aman(mahasiswa.nim)}</td>
                    <td>${aman(mahasiswa.kelamin)}</td>
                    <td>${mahasiswa.semester}</td>
                    <td>${mahasiswa.ipk.toFixed(2)}</td>
                    <td>
                        <button
                            class="btn-edit"
                            onclick="editData('${encodeURIComponent(mahasiswa.nim)}')"
                        >
                            Edit
                        </button>

                        <button
                            class="btn-hapus"
                            onclick="hapusData('${encodeURIComponent(mahasiswa.nim)}')"
                        >
                            Hapus
                        </button>
                    </td>
                `;

                tabel.appendChild(baris);
            });
        }

        function editData(nimTerenkode) {
            const nim = decodeURIComponent(nimTerenkode);
            const mahasiswa = ambilData().find(function (item) {
                return item.nim === nim;
            });

            if (!mahasiswa) return;

            document.getElementById("nama").value = mahasiswa.nama;
            document.getElementById("nim").value = mahasiswa.nim;
            document.getElementById("kelamin").value = mahasiswa.kelamin;
            document.getElementById("semester").value = mahasiswa.semester;
            document.getElementById("ipk").value = mahasiswa.ipk;

            nimYangDiedit = mahasiswa.nim;
            document.getElementById("tombolSimpan").textContent =
                "Simpan Perubahan";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        function hapusData(nimTerenkode) {
            const nim = decodeURIComponent(nimTerenkode);

            if (!confirm("Apakah Anda yakin ingin menghapus data ini?")) {
                return;
            }

            const dataBaru = ambilData().filter(function (mahasiswa) {
                return mahasiswa.nim !== nim;
            });

            simpanDatabase(dataBaru);
            resetForm();
            tampilkanData();
        }

        function resetForm() {
            document.getElementById("formMahasiswa").reset();
            nimYangDiedit = null;
            document.getElementById("tombolSimpan").textContent =
                "Simpan Data";
        }

        function aman(teks) {
            const elemen = document.createElement("div");
            elemen.textContent = teks;
            return elemen.innerHTML;
        }

        function unduhCSV() {
            const data = ambilData();

            if (data.length === 0) {
                alert("Belum ada data yang dapat diunduh.");
                return;
            }

            const barisCSV = [
                ["Nama", "NIM", "Kelamin", "Semester", "IPK"],
                ...data.map(function (mahasiswa) {
                    return [
                        mahasiswa.nama,
                        mahasiswa.nim,
                        mahasiswa.kelamin,
                        mahasiswa.semester,
                        mahasiswa.ipk.toFixed(2)
                    ];
                })
            ];

            const isiCSV = barisCSV
                .map(function (baris) {
                    return baris
                        .map(function (nilai) {
                            return `"${String(nilai).replace(/"/g, '""')}"`;
                        })
                        .join(",");
                })
                .join("\n");

            const blob = new Blob([isiCSV], {
                type: "text/csv;charset=utf-8;"
            });

            const tautan = document.createElement("a");
            tautan.href = URL.createObjectURL(blob);
            tautan.download = "database_mahasiswa.csv";
            tautan.click();

            URL.revokeObjectURL(tautan.href);
        }

        tampilkanData();
    </script>
</body>
</html>
